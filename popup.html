<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, system-ui, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-top: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
    }
    #thresholdValue {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Negatif İçerik Filtresi</h1>

  <div class="toggle-row">
    <span>Aktif</span>
    <input type="checkbox" id="enabledToggle" />
  </div>

  <label for="thresholdSlider">
    Hassasiyet: <span id="thresholdValue">0.7</span>
  </label>
  <input type="range" id="thresholdSlider" min="0" max="1" step="0.1" />

  <script src="popup.js"></script>
</body>
</html>
